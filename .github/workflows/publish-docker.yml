name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  version:
    name: Validate release version
    needs: quality
    runs-on: ubuntu-24.04
    outputs:
      app_version: ${{ steps.check.outputs.app_version }}
    steps:
      - uses: actions/checkout@v6
      - name: Check package, lockfile and tag
        id: check
        shell: bash
        run: |
          tag=""
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          fi
          version="$(node scripts/check-release-version.mjs "$tag")"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"

  publish_amd64:
    name: Build and publish amd64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "Missing repository variable: DOCKERHUB_USERNAME" >&2
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "Missing repository secret: DOCKERHUB_TOKEN" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/gamenote:amd64-${{ github.sha }}
          cache-from: type=gha,scope=gamenote-amd64
          cache-to: type=gha,mode=max,scope=gamenote-amd64
          provenance: true
          sbom: true
          build-args: |
            OCI_REVISION=${{ github.sha }}
            APP_VERSION=${{ needs.version.outputs.app_version }}

  publish_arm64:
    name: Build and publish arm64
    needs: [version, publish_amd64]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/gamenote:arm64-${{ github.sha }}
          cache-from: type=gha,scope=gamenote-arm64
          cache-to: type=gha,mode=max,scope=gamenote-arm64
          provenance: true
          sbom: true
          build-args: |
            OCI_REVISION=${{ github.sha }}
            APP_VERSION=${{ needs.version.outputs.app_version }}

  publish_manifest:
    name: Publish multi-platform manifest
    needs: [publish_amd64, publish_arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate final image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/gamenote
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Assemble and verify multi-platform image
        shell: bash
        env:
          IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/gamenote
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags=()
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=("$tag")
              tag_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if (( ${#tags[@]} == 0 )); then
            echo "No release tags generated" >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" \
            "$IMAGE:amd64-$GITHUB_SHA" \
            "$IMAGE:arm64-$GITHUB_SHA"

          first_tag="${tags[0]}"
          docker buildx imagetools inspect --raw "$first_tag" |
            jq -e '[.manifests[]? | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools inspect "$first_tag" >> "$GITHUB_STEP_SUMMARY"
